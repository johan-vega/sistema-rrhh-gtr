<div class="worker-shell">

  <!-- TOP BAR (mobile) -->
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <img class="brand-logo" src="/assets/GTR_FONDO_TRANSPARENTE_LOGO_BLANCO.png" alt="GTR" />
        <span class="brand-name">PORTAL DEL TRABAJADOR</span>
      </div>
      <div class="topbar-actions">
        <a routerLink="/worker/notifications" class="topbar-btn" aria-label="Notificaciones" title="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </a>
        <button class="topbar-btn" (click)="logout()" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- SIDEBAR (desktop) -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img class="brand-logo" src="/assets/GTR_FONDO_TRANSPARENTE_LOGO_BLANCO.png" alt="GTR" />
      <span class="brand-name">PORTAL DEL TRABAJADOR</span>
    </div>

    <div class="sidebar-user">
      <div class="user-avatar">{{ auth.currentUser()?.name?.charAt(0) }}</div>
      <div class="user-info">
        <p class="user-name">{{ auth.currentUser()?.full_name }}</p>
        <p class="user-role">Trabajador de Planta</p>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/worker/dashboard" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" />
            <rect x="14" y="3" width="7" height="5" />
            <rect x="14" y="12" width="7" height="9" />
            <rect x="3" y="16" width="7" height="5" />
          </svg>
        </span>
        <span>Inicio</span>
      </a>
      <a routerLink="/worker/requests" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
          </svg>
        </span>
        <span>Mis Solicitudes</span>
      </a>
      <a routerLink="/worker/calendar" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </span>
        <span>Mi Calendario</span>
      </a>
      <a routerLink="/worker/profile" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </span>
        <span>Mi Perfil</span>
      </a>
      <a routerLink="/worker/notifications" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
          </svg>
        </span>
        <span>Notificaciones</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="nav-item logout-btn" (click)="logout()">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
        </span>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <router-outlet />
  </main>

  <!-- BOTTOM NAV (mobile) -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <a routerLink="/worker/dashboard" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="9" />
          <rect x="14" y="3" width="7" height="5" />
          <rect x="14" y="12" width="7" height="9" />
          <rect x="3" y="16" width="7" height="5" />
        </svg>
      </span>
      <span class="nav-label">Inicio</span>
    </a>
    <a routerLink="/worker/requests" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
          <polyline points="14 2 14 8 20 8" />
          <line x1="16" y1="13" x2="8" y2="13" />
          <line x1="16" y1="17" x2="8" y2="17" />
        </svg>
      </span>
      <span class="nav-label">Solicitudes</span>
    </a>
    <a routerLink="/worker/calendar" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" />
          <line x1="16" y1="2" x2="16" y2="6" />
          <line x1="8" y1="2" x2="8" y2="6" />
          <line x1="3" y1="10" x2="21" y2="10" />
        </svg>
      </span>
      <span class="nav-label">Calendario</span>
    </a>
    <a routerLink="/worker/profile" routerLinkActive="active" class="bottom-nav-item">
      <span class="nav-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      </span>
      <span class="nav-label">Perfil</span>
    </a>
  </nav>

</div>
